# CI for the template itself: lint, security guards, LaTeX smoke compiles, and
# an import/compile check of the Python tooling.
#
# Fork-friendly by design. Forks personalize CLAUDE.md, the skill files, and the
# LaTeX examples, so nothing here asserts specific content — it asserts that the
# machinery still works and that no personal data got committed.
#
# Security posture: this repo is forked and then filled with real personal data,
# so the security-guards job fails a change that tracks anything under
# documents/ or working/outreach/, weakens the personal-data gitignore rules, or
# widens the Claude Code permission allowlist. Honest limit: a change can edit
# this workflow itself, so these guards catch accidents, not a determined
# author — branch protection and human review of workflow diffs remain the real
# backstop. Actions are pinned to commit SHAs and the token is read-only.
#
# Deliberately NOT here: anything that hits a live job board or LinkedIn.
# Those requests are personal-use only, network-flaky, and automating them from
# CI would violate the terms the outreach skill tells you to respect.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills, commands, settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # PyYAML is optional — the linter falls back to its own frontmatter
      # reader. Installed here so CI exercises the PyYAML path.
      - run: pip install pyyaml
      - run: python -B tools/lint_skills.py

  security-guards:
    name: Security guards (tracked data, gitignore, permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -B tools/security_guards.py
      # A committed conflict marker passes every other gate: the file still parses
      # as Markdown and its links still resolve. One shipped in DOCTRINE.md.
      - run: python -B tools/check_conflict_markers.py

  python-tooling:
    name: Python tooling compiles and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Byte-compile every tool
        run: |
          python -m compileall -q tools working/scripts
      - name: Sweep validator accepts the shipped template
        run: python -B working/scripts/validate_job_sweep.py working/templates/SWEEP_TEMPLATE.md
      - name: Port primitive fails closed while the sign-off name is a placeholder
        run: |
          if python -B working/scripts/template/template_port.py port missing.json missing.json; then
            echo "::error::template_port.py should exit non-zero before the sign-off name is set"
            exit 1
          fi
      - name: Visualization builds from the example dataset
        run: |
          python -B working/scripts/viz/build_job_viz_three.py
          test -s working/active/job_search_viz.html
      - name: Visualization passes its structural checks
        run: python -B working/scripts/utils/check_viz_three.py
      - name: floorprice collects from the example dataset
        run: |
          python -B working/scripts/floorprice/collect.py
          test -s working/scripts/floorprice/observations.json
      - name: floorprice refuses a band on thin data
        run: |
          # The refusal is the load-bearing behaviour: a filter matching nothing
          # must exit 1 rather than reporting a band over an empty sample.
          if python -B working/scripts/floorprice/band.py --role zzz-no-such-role; then
            echo "band.py reported a band with no observations behind it"; exit 1
          fi
      - name: floorprice prices the example offer
        run: python -B working/scripts/floorprice/offer.py working/scripts/floorprice/offer.example.json
      - name: floorprice briefs from the example dataset
        run: python -B working/scripts/floorprice/brief.py --offer working/scripts/floorprice/offer.example.json
      - name: floorprice refuses to brief on thin data
        run: |
          # Same refusal as band.py. A rehearsal built on two postings teaches you
          # to say a number you cannot defend.
          if python -B working/scripts/floorprice/brief.py --role zzz-no-such-role; then
            echo "brief.py produced a brief with nothing behind it"; exit 1
          fi
      - name: Run tests when present
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -t . -v
          else
            echo "No tests/ directory; skipping"
          fi

  latex-smoke:
    name: Compile example CV and cover letter
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends poppler-utils
          fi
      # The two files need different engines: cover.cls is XeTeX-only and
      # errors out under lualatex.
      - name: Compile CV example (lualatex)
        run: |
          cd cv
          lualatex -interaction=nonstopmode -halt-on-error main_example.tex
          test -f main_example.pdf
          if grep -q '^!' main_example.log; then
            echo '::error::lualatex reported errors compiling cv/main_example.tex'
            grep -A3 '^!' main_example.log
            exit 1
          fi
      - name: Compile cover letter example (xelatex)
        run: |
          cd cover_letters
          xelatex -interaction=nonstopmode -halt-on-error cover_example.tex
          test -f cover_example.pdf
          if grep -q '^!' cover_example.log; then
            echo '::error::xelatex reported errors compiling cover_letters/cover_example.tex'
            grep -A3 '^!' cover_example.log
            exit 1
          fi
      - name: Verify extractable PDF text
        run: |
          python3 tools/verify_pdf.py cv/main_example.pdf --min-chars 100
          python3 tools/verify_pdf.py cover_letters/cover_example.pdf --min-chars 100

  dependency-review:
    name: Dependency review
    # Needs the repo's Dependency graph, which not every fork enables — so the
    # graph is probed first and the job warns and passes rather than failing
    # when it is unavailable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped — enable it under Settings -> Advanced Security to activate this check."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
