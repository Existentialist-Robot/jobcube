<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="jobcube — second-strike capability for job applications">
  <title>jobcube</title>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#b98cff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <g id="trefoil">
      <polygon fill="#b98cff" points="32,8.8 51.8,19.5 32,30.3 12.2,19.5"/>
      <polygon fill="#b98cff" points="10.6,22.1 30.4,32.9 30.4,54.4 10.6,43.6"/>
      <polygon fill="#b98cff" points="53.4,22.1 33.6,32.9 33.6,54.4 53.4,43.6"/>
      <circle fill="#3fca7d" cx="32" cy="33.5" r="3.6"/>
    </g>
    <g id="silo">
      <rect fill="#8d85a8" opacity=".28" x="4" y="48" width="56" height="11" rx="2"/>
      <rect fill="#8d85a8" opacity=".8" x="5" y="19" width="18" height="6" rx="1"/>
      <rect fill="#8d85a8" opacity=".8" x="41" y="19" width="18" height="6" rx="1"/>
      <rect fill="#b98cff" x="25.5" y="14" width="13" height="40" rx="2.5"/>
      <path fill="#3fca7d" d="M25.5,22 L25.5,16.5 A2.5,2.5 0 0 1 28,14 L36,14 A2.5,2.5 0 0 1 38.5,16.5 L38.5,22 Z"/>
    </g>
    <g id="boomer">
      <rect fill="#8d85a8" opacity=".2" x="4" y="32" width="56" height="27" rx="3"/>
      <rect fill="#8d85a8" opacity=".55" x="4" y="30" width="56" height="3" rx="1.5"/>
      <path fill="#b98cff" d="M8,42 C8,36.5 17,34.5 32,34.5 C47,34.5 56,36.5 56,42 C56,47.5 47,49.5 32,49.5 C17,49.5 8,47.5 8,42 Z"/>
      <rect fill="#b98cff" x="28.5" y="21" width="7" height="15" rx="2"/>
      <rect fill="#3fca7d" x="28.5" y="19" width="7" height="6" rx="1.5"/>
    </g>
    <g id="bomber">
      <path fill="#8d85a8" opacity=".22" d="M4,50 C18,42 46,42 60,50 L60,56 L4,56 Z"/>
      <path fill="#b98cff" d="M32,9 L58,44 L38,39.5 L32,48 L26,39.5 L6,44 Z"/>
      <rect fill="#3fca7d" x="29" y="14" width="6" height="7" rx="1.5"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#0b0910"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- ── left: wordmark block ───────────────────────────── -->
  <!-- Weight comes from a matched stroke rather than font-weight, so the mark
       renders identically wherever Consolas Bold is absent. Keep the stroke
       colour equal to the fill on each tspan. -->
  <text x="96" y="322" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace"
        font-size="108" letter-spacing="-2" paint-order="stroke fill" stroke-linejoin="round">
    <tspan fill="#e9e6f5" stroke="#e9e6f5" stroke-width="4">job</tspan><tspan fill="#b98cff" stroke="#b98cff" stroke-width="4">cube</tspan>
  </text>

  <rect x="99" y="360" width="104" height="5" rx="2.5" fill="#b98cff"/>

  <text x="99" y="424" font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="34" fill="#a49cbe">Second-strike capability for job applications.</text>

  <!-- ── right: the triad emblem ────────────────────────── -->
  <g transform="translate(792,138)">
    <g stroke="#8d85a8" stroke-width="2" opacity=".45" stroke-linecap="round" fill="none">
      <path d="M182,182 L182,88"/><path d="M182,182 L263,229"/><path d="M182,182 L101,229"/>
    </g>
    <use href="#trefoil" transform="translate(142,142) scale(1.25)"/>
    <use href="#silo"   transform="translate(150,26) scale(1.0)"/>
    <use href="#boomer" transform="translate(231,226) scale(1.0)"/>
    <use href="#bomber" transform="translate(69,226) scale(1.0)"/>
    <g font-family="'Cascadia Mono',Consolas,monospace" font-size="14"
       letter-spacing="2.4" fill="#8d85a8" text-anchor="middle">
      <text x="182" y="14">PORTAL</text>
      <text x="263" y="316">OUTREACH</text>
      <text x="101" y="316">WARM INTRO</text>
    </g>
  </g>
</svg>
