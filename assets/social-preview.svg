<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="jobcube — second-strike capability for job applications">
  <title>jobcube</title>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#b98cff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <g id="trefoil">
  <polygon fill="#b98cff" points="32,8.8 51.8,19.5 32,30.3 12.2,19.5"/>
  <polygon fill="#b98cff" points="10.6,22.1 30.4,32.9 30.4,54.4 10.6,43.6"/>
  <polygon fill="#b98cff" points="53.4,22.1 33.6,32.9 33.6,54.4 53.4,43.6"/>
  <circle fill="#3fca7d" cx="32" cy="33.5" r="3.6"/>
    </g>
    <g id="silo">
  <rect fill="#8d85a8" opacity=".28" x="2" y="46" width="60" height="13" rx="2"/>
  <rect fill="#8d85a8" opacity=".55" x="21" y="34" width="22" height="16" rx="2"/>
  <path fill="#8d85a8" opacity=".85" d="M17.6,26.8 L22.4,32.2 L6.4,46.7 L1.6,41.3 Z"/>
  <path fill="#8d85a8" opacity=".85" d="M46.4,26.8 L41.6,32.2 L57.6,46.7 L62.4,41.3 Z"/>
  <rect fill="#b98cff" x="26" y="8" width="12" height="34" rx="2.5"/>
  <path fill="#3fca7d" d="M26,16 L26,10.5 A2.5,2.5 0 0 1 28.5,8 L35.5,8 A2.5,2.5 0 0 1 38,10.5 L38,16 Z"/>
    </g>
    <g id="patrol">
  <rect fill="#8d85a8" opacity=".4" x="4" y="21" width="56" height="2" rx="1"/>
  <rect fill="#b98cff" x="6" y="41" width="9" height="4.5" rx="2.25"/>
  <rect fill="#b98cff" x="10" y="36" width="44" height="15" rx="7.5"/>
  <rect fill="#b98cff" x="26" y="25" width="12" height="12" rx="2"/>
  <rect fill="#b98cff" x="30.5" y="15" width="3" height="11" rx="1.5"/>
  <path fill="#3fca7d" d="M28.5,17 L28.5,12.5 A2,2 0 0 1 30.5,10.5 L33.5,10.5 A2,2 0 0 1 35.5,12.5 L35.5,17 Z"/>
    </g>
    <g id="bomber">
  <path fill="#8d85a8" opacity=".22" d="M4,50 C18,42 46,42 60,50 L60,56 L4,56 Z"/>
  <path fill="#b98cff" d="M32,9 L58,44 L38,39.5 L32,48 L26,39.5 L6,44 Z"/>
  <rect fill="#3fca7d" x="29" y="14" width="6" height="7" rx="1.5"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="#0b0910"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Weight comes from a matched stroke rather than font-weight, so the mark
       renders identically wherever Consolas Bold is absent. -->
  <!-- Both halves centre their INK on y=320, the canvas centre.

       Aligning the triad's hub to a shared axis is the obvious move and it is
       wrong: the bomber label sits far above the hub while the silo and patrol
       labels sit close below it, so the diagram's ink centre is 38px above
       its hub. Matching hubs to text left the two halves 76px apart, which is
       worse than the 55px offset it was meant to fix. Both numbers below are
       derived from the glyph metrics rather than nudged by eye. -->
  <text x="96" y="305" font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace"
        font-size="112" letter-spacing="-2" paint-order="stroke fill" stroke-linejoin="round">
    <tspan fill="#e9e6f5" stroke="#e9e6f5" stroke-width="4.1">job</tspan><tspan fill="#b98cff" stroke="#b98cff" stroke-width="4.1">cube</tspan>
  </text>

  <rect x="99" y="343" width="112" height="5" rx="2.5" fill="#b98cff"/>

  <text x="99" y="407" font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="34" fill="#a49cbe">Second-strike capability for job applications.</text>

  <!-- Same triad geometry as triad.svg, scaled, and the same labels. It used to
       substitute COLD APPLY / OUTREACH / REFERRAL on the theory that a shared
       link has no table to explain the leg names. Wrong call: the leg names ARE
       the identity, the card is where someone meets them first, and a card that
       teaches different words from the docs teaches the wrong ones.

       Label size is 19, not the 13 this used to carry. A social card is read at
       roughly 500px wide in a timeline, so 13px on a 1280px canvas arrives at
       about five pixels and the labels were decoration rather than information.
       The fill is lifted off DIM for the same reason: at that scale the dim
       violet-grey disappeared into the ground.

       No double hyphen anywhere in this string. XML forbids it inside a comment,
       and emitting one here silently dropped the whole triad group from the
       rendered card while the SVG still looked fine as source. -->
  <!-- label_size is divided by the scale so the rendered size stays at 19.

       The card labels the three legs by their REGISTER, not their nickname. It has
       tried both nicknames (SILO / PATROL / BOMBER) and component names (COLD APPLY
       / OUTREACH / REFERRAL); neither works cold. The nicknames need DOCTRINE.md to
       mean anything, and the component names read as a feature list. Scripted /
       paced / crewed is still the doctrine's own vocabulary — it is the italic
       register word on each leg in DOCTRINE.md and in the network diagram — but it
       describes what the route *is like* rather than naming a weapon, so it carries
       meaning to someone who has never opened the repo. -->
  <g transform="translate(751.6,114.8) scale(1.38)">
  <g stroke="#8d85a8" stroke-width="1.6" opacity=".5" stroke-linecap="round" fill="none">
    <path d="M180.00,124.94 L180.00,95.44"/>
    <path d="M224.22,201.53 L251.45,217.25"/>
    <path d="M135.78,201.53 L111.27,215.68"/>
  </g>
  <use href="#bomber" transform="translate(156.04,30.71) scale(0.75)"/>
  <use href="#patrol" transform="translate(260.31,207.25) scale(0.75)"/>
  <use href="#silo" transform="translate(52.12,208.88) scale(0.75)"/>
  <use href="#trefoil" transform="translate(128.90,124.83) scale(1.6)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13.768115942028986"
     letter-spacing="1.5" fill="#c3bcd8" text-anchor="middle">
    <text x="180.00" y="19.36">CREWED</text>
    <text x="283.92" y="286.31">PACED</text>
    <text x="76.08" y="286.31">SCRIPTED</text>
  </g>
  </g>
</svg>
